services:
  opencode:
    build: .
    ports:
      - '127.0.0.1:4096:4096'
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    volumes:
      - opencode-data:/root/.local/share/opencode

  k6:
    image: grafana/k6:latest
    profiles:
      - test
    depends_on:
      - opencode
    environment:
      BASE_URL: http://opencode:4096
    volumes:
      - ./tests/k6:/scripts:ro
    command: run /scripts/smoke.js

volumes:
  opencode-data:
